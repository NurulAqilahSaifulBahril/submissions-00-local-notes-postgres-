services:
  db:
    image: postgres:16
    container_name: notes-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_app
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes_user -d notes_app']
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: notes-app-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notes_user:notes_password@db:5432/notes_app
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
